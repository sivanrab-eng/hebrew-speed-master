name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip queued runs between in-progress and latest
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # GitHub Pages hosts project sites under https://<user>.github.io/<repo>/
  # Change this if the repository name differs.
  VITE_BASE_PATH: /hebrew-speed-master/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static output
        run: |
          # The build output location differs between environments:
          # some runtimes write dist/client, others .output/public.
          # Detect whichever contains the prerendered index.html.
          CLIENT_DIR=""
          for d in dist/client .output/public; do
            if [ -f "$d/index.html" ]; then CLIENT_DIR="$d"; break; fi
          done
          if [ -z "$CLIENT_DIR" ]; then
            echo "Could not find a prerendered index.html in dist/client or .output/public"
            find dist .output -name '*.html' 2>/dev/null || true
            exit 1
          fi
          echo "Using client output: $CLIENT_DIR"
          # SPA fallback so refreshing any path does not 404 on GitHub Pages
          cp "$CLIENT_DIR/index.html" "$CLIENT_DIR/404.html"
          touch "$CLIENT_DIR/.nojekyll"
          echo "CLIENT_DIR=$CLIENT_DIR" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.CLIENT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
